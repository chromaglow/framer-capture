[project]
name = "framer"
version = "1.0.0"
description = "Framer - frame once, press one key per page. Windows repeat-frame screen capture."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "mss>=9,<11",
    "Pillow>=10,<12",
    "numpy>=1.26,<3",
    "img2pdf>=0.5,<0.7",
    "send2trash>=1.8,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6.6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
